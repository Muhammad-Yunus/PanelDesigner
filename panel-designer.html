<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Panel Designer - Electrical Panel Layout</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:'Segoe UI',system-ui,-apple-system,sans-serif}
html,body{height:100%;overflow:hidden;background:#0f1115;color:#d8dbe2}
#app{display:flex;flex-direction:column;height:100%}
#toolbar{height:46px;background:#171a21;border-bottom:1px solid #2a2e38;display:flex;align-items:center;gap:6px;padding:0 10px;flex-shrink:0;overflow-x:auto}
.tb-group{display:flex;align-items:center;gap:4px;padding-right:8px;border-right:1px solid #2a2e38}
.tb-group:last-child{border-right:none}
.tb-btn{background:#222632;border:1px solid #323847;color:#c6cbd6;padding:5px 10px;border-radius:5px;font-size:12px;cursor:pointer;white-space:nowrap}
.tb-btn:hover{background:#2b3040}
.tb-btn.active{background:#2563eb;border-color:#3b82f6;color:#fff}
.tb-title{font-weight:700;font-size:13px;color:#fff;margin-right:4px;letter-spacing:.3px}
input.tb-num{background:#222632;border:1px solid #323847;color:#c6cbd6;border-radius:5px;padding:4px 6px;font-size:12px;width:58px;text-align:center}
#main{display:flex;flex:1;min-height:0}
#left{width:250px;background:#171a21;border-right:1px solid #2a2e38;display:flex;flex-direction:column;flex-shrink:0}
#libSearch{margin:8px;padding:6px 8px;background:#0f1115;border:1px solid #2a2e38;border-radius:5px;color:#d8dbe2;font-size:12px;outline:none}
#libSearch:focus{border-color:#3b82f6}
#libList{flex:1;overflow-y:auto;padding:0 8px 10px}
.lib-cat{margin-top:10px;font-size:10px;text-transform:uppercase;letter-spacing:1px;color:#7c8496;margin-bottom:5px}
.lib-item{background:#1f2330;border:1px solid #2c3244;border-radius:6px;padding:6px 8px;margin-bottom:5px;cursor:grab;display:flex;justify-content:space-between;align-items:center;font-size:12px;user-select:none}
.lib-item:hover{border-color:#3b82f6;background:#242a3a}
.lib-item:active{cursor:grabbing}
.lib-item .dim{color:#6b7386;font-size:10px}
#canvasWrap{flex:1;position:relative;overflow:hidden;background:#0c0e13}
#svg{width:100%;height:100%;display:block;cursor:default;touch-action:none}
#right{width:280px;background:#171a21;border-left:1px solid #2a2e38;display:flex;flex-direction:column;flex-shrink:0;overflow-y:auto}
.rp-head{padding:9px 12px 6px;font-size:10px;text-transform:uppercase;letter-spacing:1px;color:#7c8496;border-bottom:1px solid #2a2e38;position:sticky;top:0;background:#171a21;z-index:2}
.rp-body{padding:9px 12px}
.rp-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:7px;font-size:12px;gap:6px}
.rp-row label{color:#9aa1b3;flex-shrink:0}
.rp-row input,.rp-row select{background:#0f1115;border:1px solid #2a2e38;color:#d8dbe2;border-radius:4px;padding:4px 6px;font-size:12px;width:140px;min-width:0;outline:none}
.rp-row input:focus,.rp-row select:focus{border-color:#3b82f6}
.rp-sec{font-size:10px;text-transform:uppercase;letter-spacing:.8px;color:#6b7386;margin:10px 0 5px}
.rp-btn{background:#222632;border:1px solid #323847;color:#c6cbd6;padding:6px;border-radius:5px;font-size:12px;cursor:pointer;width:100%;margin-top:6px}
.rp-btn:hover{background:#2b3040}
.rp-btn.danger{background:#2a1215;border-color:#7f1d1d;color:#fca5a5}
.rp-btn.danger:hover{background:#45161b}
.conn-item,.issue{font-size:11px;padding:5px 7px;border-radius:4px;margin-bottom:4px;background:#1f2330;border:1px solid #2c3244;cursor:default;line-height:1.35}
.issue{cursor:pointer}
.issue.error{border-color:#7f1d1d;background:#2a1215;color:#fca5a5}
.issue.warn{border-color:#854d0e;background:#2a2110;color:#fde68a}
.empty{color:#5a6174;font-size:12px;padding:12px 4px;text-align:center;line-height:1.5}
#status{height:26px;background:#171a21;border-top:1px solid #2a2e38;display:flex;align-items:center;gap:18px;padding:0 12px;font-size:11px;color:#8a92a6;flex-shrink:0}
#status .ok{color:#4ade80}
#status .err{color:#f87171;font-weight:600}
#modalBg{position:fixed;inset:0;background:rgba(0,0,0,.65);display:none;align-items:center;justify-content:center;z-index:50}
#modalBg.open{display:flex}
.modal{background:#171a21;border:1px solid #2c3244;border-radius:10px;width:800px;max-width:94vw;max-height:85vh;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.modal h3{padding:13px 16px;font-size:14px;border-bottom:1px solid #2a2e38;color:#fff}
.modal .mbody{padding:14px 16px;overflow-y:auto}
.modal .mfoot{padding:10px 16px;border-top:1px solid #2a2e38;display:flex;justify-content:flex-end;gap:8px}
.welcome-cards{display:flex;gap:14px;flex-wrap:wrap}
.welcome-card{flex:1;min-width:240px;background:#1f2330;border:1px solid #2c3244;border-radius:8px;padding:12px;cursor:pointer;text-align:left;transition:border-color .12s,background .12s;display:flex;gap:12px;align-items:flex-start}
.welcome-card:hover{border-color:#3b82f6;background:#242a3a}
.welcome-card .wthumb{flex:0 0 37%;max-width:37%;background:#0b0e14;border:1px solid #2c3244;border-radius:5px;overflow:hidden;display:flex;align-items:center;justify-content:center;padding:3px}
.welcome-card .wthumb img{display:block;width:100%;height:auto}
.welcome-card .wtext{flex:1;min-width:0}
.welcome-card b{color:#fff;font-size:13px;display:block;margin-bottom:6px}
.welcome-card span{color:#8a92a6;font-size:11px;line-height:1.5;display:block}
.welcome-card .wrow{display:flex;gap:6px;margin-top:10px;align-items:center;font-size:10px;color:#6b7386}
.mtable{width:100%;border-collapse:collapse;font-size:12px;margin-top:4px}
.mtable th{color:#7c8496;font-size:10px;text-transform:uppercase;letter-spacing:.6px;text-align:left;padding:4px 5px;border-bottom:1px solid #2a2e38}
.mtable td{padding:4px 5px;border-bottom:1px solid #1f2330}
.mtable input{background:#0f1115;border:1px solid #2a2e38;color:#d8dbe2;border-radius:4px;padding:3px 5px;font-size:12px;width:74px;outline:none}
.mtable .del{background:#2a1215;border:1px solid #7f1d1d;color:#fca5a5;border-radius:4px;padding:3px 7px;cursor:pointer;font-size:11px}
.mtable .del:hover{background:#45161b}
.mrow{display:flex;gap:8px;margin-bottom:8px}
.mrow label{font-size:12px;color:#9aa1b3;width:90px;display:flex;align-items:center}
.mrow input{background:#0f1115;border:1px solid #2a2e38;color:#d8dbe2;border-radius:4px;padding:5px 7px;font-size:12px;width:110px;outline:none}
svg text{user-select:none}
.el-name{pointer-events:none;text-anchor:middle}
.el-sub{pointer-events:none;text-anchor:middle}
.term-dot,.term-hit{cursor:crosshair}
#svg[data-mode="wire"] .elem,#svg[data-mode="wire"] .rail,#svg[data-mode="wire"] .duct,#svg[data-mode="wire"] .lbl{cursor:crosshair}
.wire{fill:none;stroke-linecap:round;stroke-linejoin:round;cursor:pointer}
.wire-hit{fill:none;stroke:transparent;stroke-linecap:round;pointer-events:stroke;cursor:pointer}
.sel-outline{fill:none;stroke:#3b82f6;stroke-dasharray:5 4;stroke-width:1.2;pointer-events:none}
.ghost{pointer-events:none}
.dim-text{font-size:4.6px;fill:#64748b;text-anchor:middle;pointer-events:none}
.bus-label{font-size:5.2px;font-weight:700;text-anchor:middle;pointer-events:none}
/* Wire show/hide floating panel (KiCad-style) */
.wp{position:absolute;top:10px;right:10px;width:276px;max-height:calc(100% - 20px);display:flex;flex-direction:column;
  background:#171a21;border:1px solid #2c3244;border-radius:8px;box-shadow:0 10px 34px rgba(0,0,0,.5);z-index:20;overflow:hidden}
.wp.hidden{display:none}
.wp-head{display:flex;align-items:center;justify-content:space-between;padding:7px 10px;background:#1f2330;border-bottom:1px solid #2a2e38;cursor:pointer;flex-shrink:0}
.wp-title{font-size:11px;text-transform:uppercase;letter-spacing:.8px;color:#c6cbd6;font-weight:600}
.wp-count{color:#7c8496;font-weight:400;letter-spacing:0}
.wp-min{background:none;border:1px solid #323847;color:#9aa1b3;font-size:14px;cursor:pointer;line-height:1;padding:1px 6px;border-radius:4px}
.wp-min:hover{background:#2b3040;color:#d8dbe2}
.wp-body{display:flex;flex-direction:column;min-height:0}
.wp.collapsed .wp-body{display:none}
.wp-filters{display:flex;gap:6px;padding:8px;border-bottom:1px solid #2a2e38;flex-shrink:0}
.wp-filters input[type=text]{flex:1;min-width:0;background:#0f1115;border:1px solid #2a2e38;color:#d8dbe2;border-radius:4px;padding:4px 7px;font-size:12px;outline:none}
.wp-filters input[type=text]:focus{border-color:#3b82f6}
.wp-cf{display:flex;align-items:center;gap:1px;border:1px solid #2a2e38;border-radius:4px;padding:1px 2px;background:#0f1115}
.wp-cf.on{border-color:#3b82f6;box-shadow:0 0 0 1px #3b82f6 inset}
.wp-cf input[type=color]{width:28px;height:22px;border:none;background:none;cursor:pointer;padding:0}
.wp-cf button{background:none;border:none;color:#9aa1b3;cursor:pointer;font-size:14px;line-height:1;padding:0 2px}
.wp-cf button:hover{color:#fff}
.wp-actions{display:flex;gap:6px;padding:6px 8px;border-bottom:1px solid #2a2e38;flex-shrink:0}
.wp-actions button{flex:1;background:#222632;border:1px solid #323847;color:#c6cbd6;border-radius:4px;padding:4px;font-size:11px;cursor:pointer}
.wp-actions button:hover{background:#2b3040}
.wp-list{overflow-y:auto;padding:4px 6px;min-height:26px;max-height:46vh}
.wp-row{display:flex;align-items:center;gap:8px;padding:4px 6px;border-radius:4px;cursor:pointer}
.wp-row:hover{background:#1f2330}
.wp-row.sel{background:#243049}
.wp-row input[type=checkbox]{flex-shrink:0;cursor:pointer;width:14px;height:14px;accent-color:#3b82f6}
.wp-name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#d8dbe2;font-size:11.5px}
.wp-row.off .wp-name{color:#5a6174;text-decoration:line-through}
.wp-bar{flex:0 0 34px;height:11px;border-radius:2px;border:1px solid rgba(255,255,255,.18)}
.wp-empty{color:#5a6174;font-size:11px;padding:12px 4px;text-align:center;line-height:1.5}
/* Print: hide UI, show only #printOverlay */
#printOverlay{display:none}
html.printing #app,html.printing #toolbar,html.printing #left,html.printing #right,
html.printing #status,html.printing #modalBg{display:none!important}
html.printing #printOverlay{display:block!important;position:fixed;inset:0;background:#fff;overflow:hidden;z-index:9999}
html.printing #printOverlay svg{display:block;margin:0 auto}
@media print{
  html,body{overflow:visible;background:#fff}
  html.printing body>*:not(#printOverlay){display:none!important}
  html.printing #printOverlay{position:static;width:100%;height:100%}
  html.printing #printOverlay svg{width:100vw;height:100vh}
}
</style>
</head>
<body>
<div id="app">
  <div id="toolbar">
    <span class="tb-title">Panel Designer</span>
    <div class="tb-group">
      <button class="tb-btn" id="btnNew">New</button>
      <button class="tb-btn" id="btnExport">Export</button>
      <button class="tb-btn" id="btnImport">Import</button>
      <button class="tb-btn" id="btnPrint">Print</button>
      <button class="tb-btn" id="btnWires">Filters</button>
    </div>
    <div class="tb-group">
      <button class="tb-btn active" data-mode="select" id="mSelect">Select</button>
      <button class="tb-btn" data-mode="wire" id="mWire">Wire</button>
      <button class="tb-btn" data-mode="label" id="mLabel">Label</button>
      <button class="tb-btn" id="btnDelete">Delete</button>
      <button class="tb-btn" id="btnUndo">Undo</button>
      <button class="tb-btn" id="btnRedo">Redo</button>
      <button class="tb-btn" id="btnStraight" title="Luruskan seluruh kabel yang tidak tegak/lurus">Straighten</button>
    </div>
    <div class="tb-group">
      <button class="tb-btn" id="btnZoomOut" title="Zoom out">−</button>
      <input class="tb-num" id="zoomVal" value="100%">
      <button class="tb-btn" id="btnZoomIn" title="Zoom in">+</button>
      <button class="tb-btn" id="btnFit">Fit</button>
      <button class="tb-btn active" id="btnGrid">Grid</button>
      <button class="tb-btn" id="btnDim">Dimensions</button>
    </div>
    <div class="tb-group">
      <button class="tb-btn" id="btnPanelSettings">Panel Settings-</button>
    </div>
  </div>
  <div id="main">
    <aside id="left">
      <input id="libSearch" placeholder="Search part-" autocomplete="off">
      <div id="libList"></div>
    </aside>
    <div id="canvasWrap">
      <svg id="svg" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <pattern id="gridMinor" width="10" height="10" patternUnits="userSpaceOnUse">
            <path d="M10 0H0V10" fill="none" stroke="#1b1f2a" stroke-width=".5"/>
          </pattern>
          <pattern id="gridMajor" width="100" height="100" patternUnits="userSpaceOnUse">
            <rect width="100" height="100" fill="url(#gridMinor)"/>
            <path d="M100 0H0V100" fill="none" stroke="#262c3b" stroke-width=".8"/>
          </pattern>
        </defs>
        <g id="viewport">
          <g id="lyrGrid"></g>
          <g id="lyrPanel"></g>
          <g id="lyrBus"></g>
          <g id="lyrRail"></g>
          <g id="lyrDuct"></g>
          <g id="lyrElem"></g>
          <g id="lyrWire"></g>
          <g id="lyrTerm"></g>
          <g id="lyrLabel"></g>
          <g id="lyrOver"></g>
        </g>
      </svg>
      <div id="wirePanel" class="wp hidden">
        <div class="wp-head" id="wpHead">
          <span class="wp-title">Wires <span id="wpCount" class="wp-count"></span></span>
          <button class="wp-min" id="wpMin" title="Collapse / Expand">–</button>
        </div>
        <div class="wp-body">
          <div class="wp-filters">
            <input type="text" id="wpFilterName" placeholder="Filter wire name-" autocomplete="off">
            <span class="wp-cf" id="wpCf" title="Filter by color">
              <input type="color" id="wpFilterColor" value="#ef4444">
              <button id="wpColorClear" title="Matikan filter warna">×</button>
            </span>
          </div>
          <div class="wp-actions">
            <button id="wpShowAll">Show all</button>
            <button id="wpHideAll">Hide all</button>
          </div>
          <div class="wp-list" id="wpList"></div>
        </div>
      </div>
    </div>
    <aside id="right">
      <div class="rp-head" id="rpTitle">Properties</div>
      <div class="rp-body" id="rpBody"></div>
      <div class="rp-head">Validation</div>
      <div class="rp-body" id="rpIssues"></div>
    </aside>
  </div>
  <div id="status">
    <span id="stMode">Mode: Select</span>
    <span id="stCoord">X: 0 Y: 0 mm</span>
    <span id="stZoom">Zoom 100%</span>
    <span id="stSave">Auto-save: -</span>
    <span id="stIssues">Issues: 0</span>
  </div>
</div>
<div id="modalBg"><div class="modal" id="modal"></div></div>
<input type="file" id="fileImport" accept=".json,application/json" style="display:none">

  if (key === 'L|PE') return { level:'error', msg:'PHASE-EARTH SHORT - L terhubung ke PE' };

    if (w.from && w.from.el === elId && w.from.term === term) other = w.to;
    else if (w.to && w.to.el === elId && w.to.term === term) other = w.from;
    if (!other || !other.el) continue;
    const c = termClass(other.el, other.term);
    if (c && c !== 'CONTACT' && c !== 'OTHER') return { cls:c, wireId:w.id };
  }

}
/* Untuk pasangan dry contact: hanya bahaya keras; selainnya aman */
function contactHazard(a, b){
  if (!a || !b || a === b) return null;
  if (a === 'AC' || b === 'AC') return null;
  const ga = classGroup(a), gb = classGroup(b);
  if (ga === gb){
    if (/^L\d$/.test(a) && /^L\d$/.test(b) && a !== b)
      return { level:'warn', msg:`CROSS-PHASE: ${a} ↔ ${b}` };
    return null;
  }
  const key = [ga,gb].sort().join('|');
  if (key === 'L|N')  return { level:'error', msg:'PHASE-NEUTRAL SHORT - L terhubung ke N' };
  if (key === 'L|PE') return { level:'error', msg:'PHASE-EARTH SHORT - L terhubung ke PE' };
  if (key === 'N|PE') return { level:'error', msg:'NEUTRAL-EARTH SHORT - N terhubung ke PE' };
  if (key === 'DC+|DC-') return { level:'error', msg:'DC SUPPLY SHORT - 24V+ terhubung ke 24V-' };
  return null;
}
function contactPairIssues(){
  const out = [];
  for (const e of S.elements){
    if (e.type !== 'contactor') continue;
    for (const pair of [['R1','R2'], ['1','2']]){
      const s1 = contactSignal(e.id, pair[0]);
      const s2 = contactSignal(e.id, pair[1]);
      if (!s1 || !s2) continue;
      const hz = contactHazard(s1.cls, s2.cls);
      if (hz) out.push({ wireId:s1.wireId, level:hz.level,
        msg:`CONTACT ${pair[0]}/${pair[1]} (${e.name || 'Contactor'}) - ${hz.msg}` });
    }
  }
  return out;
}
function validateAll(){
  const out = [];
  for (const w of S.wires){
    const v = validateWire(w);
    if (v) out.push({ wireId:w.id, level:v.level, msg:v.msg });
  }
  return out.concat(contactPairIssues());
}

function wirePointsStr(pts){ return pts.map(p=>p.x+','+p.y).join(' '); }
function drawTwist(w, gr, col, wd){
  const d = twistD(w, wd);
  if (d) svgEl('path', { d:d, fill:'none', stroke:col, 'stroke-width':wd, 'pointer-events':'none' }, gr);

function twistD(w, wd){
  const pts = w.pts || [];
  if (pts.length < 2) return '';
  const dists = [0];
  for (let i=1; i<pts.length; i++)
    dists[i] = dists[i-1] + Math.hypot(pts[i].x-pts[i-1].x, pts[i].y-pts[i-1].y);
  const total = dists[pts.length-1];
  if (total <= 0) return '';
  const STEP = 0.75, PERIOD = 7;
  const amp = wd*0.35 + 0.15;
  const c1 = [];
  for (let t=0; t<=total+1e-9; t+=STEP){
    let i = 0;
    while (i < pts.length-2 && dists[i+1] < t) i++;
    const seg = Math.max(1e-6, dists[i+1]-dists[i]);
    const f = Math.max(0, Math.min(1, (t-dists[i])/seg));
    const x = pts[i].x + (pts[i+1].x-pts[i].x)*f;
    const y = pts[i].y + (pts[i+1].y-pts[i].y)*f;
    let dx = pts[i+1].x-pts[i].x, dy = pts[i+1].y-pts[i].y;
    const L = Math.hypot(dx,dy) || 1; dx/=L; dy/=L;
    const a = amp*Math.sin(2*Math.PI*t/PERIOD);
    c1.push({ x:x-dy*a, y:y+dx*a });
  }
  const last = pts[pts.length-1];
  c1[c1.length-1] = { x:last.x, y:last.y };
  c1[0] = { x:pts[0].x, y:pts[0].y };
  if (!c1.length) return '';
  let d = 'M' + c1[0].x + ' ' + c1[0].y;
  for (let i=0;i<c1.length-1;i++){
    const p0 = c1[i-1] || c1[i], p1 = c1[i], p2 = c1[i+1];
    const p3 = c1[i+2] || p2;
    const c1x = p1.x + (p2.x-p0.x)/6, c1y = p1.y + (p2.y-p0.y)/6;
    const c2x = p2.x - (p3.x-p1.x)/6, c2y = p2.y - (p3.y-p1.y)/6;
    d += ' C' + c1x + ' ' + c1y + ' ' + c2x + ' ' + c2y + ' ' + p2.x + ' ' + p2.y;
  }
  return d;
}
function rs485Side(w){
  const ft = (w.from && w.from.term) || '';
  const tt = (w.to && w.to.term) || '';
  if (/RS485A/.test(ft) || /RS485A/.test(tt)) return 'A';
  if (/RS485B/.test(ft) || /RS485B/.test(tt)) return 'B';

}
function autoWireCls(w){
  const side = rs485Side(w);

  if (cls === 'CONTACT' || cls === 'OTHER'){
    const c2 = refClass(w.to);
    if (c2 !== 'CONTACT' && c2 !== 'OTHER') cls = c2;
  }
  return cls;
}
function wireClsName(w){
  if (w.cls) return w.cls;

}
function wireName(w){
  if (w.label && String(w.label).trim()) return String(w.label).trim();
  if (w.cls) return w.cls;

}
function refClass(ref){
  if (!ref || !ref.el) return 'OTHER';
  return VR_MAP[ref.term] || termClass(ref.el, ref.term);
}
function wireColor(w){
  if (w.color) return w.color;
  if (w.cls) return CLASS_COLOR[w.cls] || '#94a3b8';
  const side = rs485Side(w);
  if (side === 'A') return '#fb923c';
  if (side === 'B') return '#f97316';
  let cls = refClass(w.from);
  if (cls === 'CONTACT' || cls === 'OTHER'){
    const c2 = refClass(w.to);
    if (c2 !== 'CONTACT' && c2 !== 'OTHER') cls = c2;
  }

}

  renderElems(); renderTerms(); renderWires(); renderLabels(); renderOverlay();
  renderProps(); renderIssues(); renderWirePanel();
}
/* ===================== WIRE ORTHOGONAL PATH ===================== */
function orthoPreview(pts, cur){
  const out = pts.slice();
  const last = out[out.length-1];
  if (out.length === 1){
    /* first segment direction depends on terminal exit side */
    const d = ui.drawing;
    const tp = d && d.from ? getTermPos(d.from.el, d.from.term) : null;
    const side = tp ? tp.side : 'bottom';
    if (side==='top' || side==='bottom') out.push({ x:last.x, y:cur.y });
    else out.push({ x:cur.x, y:last.y });
  } else {
    const prev = out[out.length-2];
    const horiz = Math.abs(last.y - prev.y) < 0.01;
    if (horiz) out.push({ x:last.x, y:cur.y });
    else out.push({ x:cur.x, y:last.y });
  }
  out.push({ x:cur.x, y:cur.y });
  return out;
}
/* ===================== MULTI-WIRE PER TERMINAL HOLE ===================== */
function rebuildWire(w){
  const sPt = getTermPos(w.from.el, w.from.term);
  const ePt = getTermPos(w.to.el, w.to.term);
  if (!sPt || !ePt){ w.pts = (w.rawPts || w.pts || []).slice(); return w; }
  if (!w.rawPts || !w.rawPts.length) w.rawPts = (w.pts && w.pts.length) ? w.pts.slice() : [sPt, ePt];
  w.rawPts[0] = sPt;
  w.rawPts[w.rawPts.length-1] = ePt;
  /* same-signal wires share one hole: keep path merged (no fan-out) */
  w.pts = w.rawPts.slice();
  return w;
}
function rebuildAllWires(){ S.wires.forEach(rebuildWire); }
/* jalur tegak/lurus terpendek antar dua terminal (siku tunggal) */
function routeOrtho(sPt, ePt){
  const out = [ { x:sPt.x, y:sPt.y } ];
  const sVert = (sPt.side === 'top' || sPt.side === 'bottom');
  if (sVert) out.push({ x:sPt.x, y:ePt.y });
  else out.push({ x:ePt.x, y:sPt.y });
  out.push({ x:ePt.x, y:ePt.y });
  return out;
}
/* saat elemen digeser: walau tanpa rebuildManual, wire sederhana (<=4 titik)
   di-route ulang supaya garis tegak/lurusnya memendek mengikuti posisi baru;
   route manual panjang (>4 titik) dipertahankan */
function rerouteWire(w){
  const sPt = getTermPos(w.from.el, w.from.term);
  const ePt = getTermPos(w.to.el, w.to.term);
  if (!sPt || !ePt){ rebuildWire(w); return w; }
  if (w.pts && w.pts.length > 4){ rebuildWire(w); return w; }
  const route = routeOrtho(sPt, ePt);
  w.pts = route;
  w.rawPts = route.map(p => ({ x:p.x, y:p.y }));
  return w;
}
function shiftRailChildren(r, dx, dy){
  const moved = S.elements.filter(e => e.rail === r.id);
  if (!moved.length) return true;
  const cands = moved.map(e => ({ e, rc:{ x:e.x+dx, y:e.y+dy, w:CATALOG[e.type].w, h:CATALOG[e.type].h } }));
  for (const { rc } of cands){
    for (const o of S.elements){
      if (moved.indexOf(o) >= 0) continue;
      if (gapOverlap(rc, elemRect(o))) return false;
    }
    if (busbarZones().some(bz => rectsOverlap(rc, bz))) return false;
  }
  for (const { e } of cands){
    e.x += dx; e.y += dy;
    for (const w of S.wires)
      if (w.from.el === e.id || w.to.el === e.id) rerouteWire(w);
  }
  renderElems(); renderTerms(); renderWires(); renderOverlay();
  return true;
}
/* ===================== NETWORK COLOR (shared node = one color) ===================== */
function sharesAnyHole(w1, w2){
  return (w1.from.el === w2.from.el && w1.from.term === w2.from.term) ||
         (w1.from.el === w2.to.el   && w1.from.term === w2.to.term) ||
         (w1.to.el   === w2.from.el && w1.to.term   === w2.from.term) ||
         (w1.to.el   === w2.to.el   && w1.to.term   === w2.to.term);
}
function wireNetwork(id){
  const comp = [];
  const seen = new Set([id]);
  let stack = [];
  const root = S.wires.find(w => w.id === id);
  if (root) stack.push(root);
  while (stack.length){
    const w = stack.pop();
    if (!w) continue;
    comp.push(w);
    for (const w2 of S.wires){
      if (seen.has(w2.id)) continue;
      if (sharesAnyHole(w, w2)){ seen.add(w2.id); stack.push(w2); }
    }
  }
  return comp;
}
function networkColorFix(id){
  const comp = wireNetwork(id);
  let c = '';
  for (const w of comp) if (w.color){ c = w.color; break; }
  if (c) for (const w of comp) w.color = c;
  return { comp, color:c };
}
/* ===================== AUTO STRAIGHTEN ===================== */
function straightenPts(pts){
  const p = pts.map(q => ({ x:q.x, y:q.y }));
  if (p.length < 2) return p;
  /* pass 1: relaksasi sumbu-dominan - rapikan titik yang meleset kolom/baris
     (mis. setelah din rail digeser) jadi garis lurus, bukan lipatan sepatu */
  let changed = true, guard = 0;
  while (changed && guard++ < p.length*2 + 4){
    changed = false;
    for (let i=1; i<p.length-1; i++){
      const a = p[i-1], b = p[i], c = p[i+1];
      const v1 = Math.abs(b.x-a.x) < Math.abs(b.y-a.y);
      const v2 = Math.abs(c.x-b.x) < Math.abs(c.y-b.y);
      if (v1 && v2){
        const t = Math.abs(b.x-a.x) <= Math.abs(c.x-b.x) ? a.x : c.x;
        if (b.x !== t){ b.x = t; changed = true; }
      } else if (!v1 && !v2){
        const t = Math.abs(b.y-a.y) <= Math.abs(c.y-b.y) ? a.y : c.y;
        if (b.y !== t){ b.y = t; changed = true; }
      }
    }
  }
  /* pass 2: rapikan jitter sub-mm */
  for (let i=0; i<p.length-1; i++){
    const dx = p[i+1].x - p[i].x, dy = p[i+1].y - p[i].y;
    if (Math.abs(dx) < 0.05) p[i+1].x = p[i].x;
    if (Math.abs(dy) < 0.05) p[i+1].y = p[i].y;
  }
  /* pass 3: sisa diagonal dipecah jadi siku L */
  for (let i=0; i<p.length-1; i++){
    const a = p[i], b = p[i+1];
    if (a.x !== b.x && a.y !== b.y){
      p.splice(i+1, 0, { x:b.x, y:a.y });
      i++;
    }
  }
  /* pass 4: bersihkan titik ganda */
  for (let i=p.length-1; i>0; i--){
    if (p[i].x === p[i-1].x && p[i].y === p[i-1].y) p.splice(i, 1);
  }
  return p;
}
function autoStraight(){
  if (!S.wires.length){ setStatus('Tidak ada kabel untuk diluruskan'); return; }
  const work = [];
  for (const w of S.wires){
    const np = straightenPts(w.pts || []);
    if (np.length !== (w.pts||[]).length || np.some((q,i)=>q.x!==w.pts[i].x || q.y!==w.pts[i].y))
      work.push([w, np]);
  }
  if (!work.length){ setStatus('Straighten: semua kabel sudah lurus'); return; }
  snapshot();
  for (const [w, np] of work){
    w.pts = np;
    w.rawPts = np.map(p=>({ x:p.x, y:p.y }));
  }
  renderWires(); renderOverlay();
  markDirty();
  setStatus('Straighten: ' + work.length + ' kabel diluruskan');
}

/* ===================== POINTER INTERACTION ===================== */
function findTarget(ev){
  const el = document.elementFromPoint(ev.clientX, ev.clientY);
  if (!el || !svg.contains(el)) return null;
  return el;
}
function hitWire(ev){
  const el = findTarget(ev);
  if (el && (el.classList.contains('wire') || el.classList.contains('wire-hit'))) return el.getAttribute('data-id');
  /* fallback: distance to polyline */
  const p = worldPos(ev);
  let best = null, bd = 6/ui.view.k;
  for (const w of S.wires){
    for (let i=0;i<w.pts.length-1;i++){
      const d = distSeg(p, w.pts[i], w.pts[i+1]);
      if (d < bd){ bd=d; best=w.id; }
    }
  }
  return best;
}
function distSeg(p, a, b){
  const dx = b.x-a.x, dy = b.y-a.y;
  const L2 = dx*dx + dy*dy;
  let t = L2 ? ((p.x-a.x)*dx + (p.y-a.y)*dy)/L2 : 0;
  t = clamp(t, 0, 1);
  const x = a.x + t*dx, y = a.y + t*dy;
  return Math.hypot(p.x-x, p.y-y);
}
function findWireRoute(ev){
  const p = worldPos(ev);
  let best = null, bd = 6/ui.view.k;
  for (const w of S.wires){
    for (let i=0;i<w.pts.length-1;i++){
      if (i===0 || i===w.pts.length-2) continue;
      const a = w.pts[i], b = w.pts[i+1];
      const d = distSeg(p, a, b);
      if (d < bd){ bd = d; best = { id:w.id, seg:i }; }
    }
  }
  return best;
}
function routeDragMove(d, w, wp){
  const t = snap(d.horiz ? wp.y - d.origY : wp.x - d.origX);
  if (t === d.apply) return null;
  d.apply = t;
  for (let k=d.runStart;k<=d.runEnd;k++){
    if (d.horiz) w.pts[k].y = clamp(d.origY + t, 0, S.h);
    else w.pts[k].x = clamp(d.origX + t, 0, S.w);
  }
  w.rawPts = w.pts.map(p=>({ x:p.x, y:p.y }));
  renderWires(); renderOverlay();
  return t;
}
function startRouteDrag(ev, rr){
  const w = S.wires.find(x=>x.id===rr.id); if (!w) return;
  select('wire', rr.id);
  const horiz = Math.abs(w.pts[rr.seg].x-w.pts[rr.seg+1].x) >= Math.abs(w.pts[rr.seg].y-w.pts[rr.seg+1].y);
  let s = rr.seg, e = rr.seg+1;
  if (horiz){
    const y = w.pts[rr.seg].y;
    while (s > 1 && w.pts[s-1].y === y) s--;
    while (e < w.pts.length-2 && w.pts[e+1].y === y) e++;
  } else {
    const x = w.pts[rr.seg].x;
    while (s > 1 && w.pts[s-1].x === x) s--;
    while (e < w.pts.length-2 && w.pts[e+1].x === x) e++;
  }
  ui.drag = { type:'route', id:rr.id, horiz, runStart:s, runEnd:e,
    origY:w.pts[s].y, origX:w.pts[s].x, sx:ev.clientX, sy:ev.clientY, moved:false, apply:null };
  svg.setPointerCapture(ev.pointerId);
  setStatus('Routing: geser untuk ubah jalur kabel');
}
function findTerm(ev){
  if (!(ev.target && ev.target.closest)) return null;
  if (!ev.target.closest('.term-dot, .term-hit')) return null;
  const r = svg.getBoundingClientRect();
  const cx = (ev.clientX - r.left - ui.view.x)/ui.view.k;
  const cy = (ev.clientY - r.top - ui.view.y)/ui.view.k;
  let best = null, bd = 1e9;
  for (const d of document.querySelectorAll('.term-hit')){
    const p = getTermPos(d.getAttribute('data-el'), d.getAttribute('data-term'));
    if (!p) continue;
    const dist = Math.hypot(p.x-cx, p.y-cy);
    if (dist < bd){ bd = dist; best = { el:d.getAttribute('data-el'), term:d.getAttribute('data-term') }; }
  }
  return best && bd <= 8 ? best : null;
}

        svg.setPointerCapture(ev.pointerId);
      } else if (lblG){
        const id = lblG.getAttribute('data-id');
        select('label', id);
        const l = S.labels.find(x=>x.id===id);
        ui.drag = { type:'move', kind:'label', id, dx:wp.x-l.x, dy:wp.y-l.y, sx:ev.clientX, sy:ev.clientY, moved:false };
        svg.setPointerCapture(ev.pointerId);
      }
      else {
        const rr = findWireRoute(ev);
        if (rr){ startRouteDrag(ev, rr); }
        else {
          const wid = hitWire(ev);
          if (wid){ select('wire', wid); } else select(null);
        }
      }
    }
    return;
  }
  if (ui.mode === 'label'){
    const txt = prompt('Label text:');
    if (txt && txt.trim()){
      snapshot();
      S.labels.push({ id:uid('l'), text:txt.trim(), x:snap(wp.x), y:snap(wp.y) });
      markDirty();
    }
    renderAll(); return;
  }
  /* select mode */
  if (termEl){ select(null); return; }
  const elemG = ev.target.closest && ev.target.closest('.elem');
  const railG = ev.target.closest && ev.target.closest('.rail');
  const ductG = ev.target.closest && ev.target.closest('.duct');
  const busG  = ev.target.closest && ev.target.closest('.bus');
  const lblG  = ev.target.closest && ev.target.closest('.lbl');
  if (elemG){
    const id = elemG.getAttribute('data-id');
    select('element', id);
    const e = S.elements.find(x=>x.id===id);
    ui.drag = { type:'move', kind:'element', id, dx:wp.x-e.x, dy:wp.y-e.y, sx:ev.clientX, sy:ev.clientY, moved:false };
    svg.setPointerCapture(ev.pointerId);
  } else if (railG){
    const id = railG.getAttribute('data-id');
    select('rail', id);
    const r = S.rails.find(x=>x.id===id);
    ui.drag = { type:'move', kind:'rail', id, dx:wp.x-r.x, dy:wp.y-r.y, sx:ev.clientX, sy:ev.clientY, moved:false };
    svg.setPointerCapture(ev.pointerId);
  } else if (ductG){
    const id = ductG.getAttribute('data-id');
    select('duct', id);
    const d = S.ducts.find(x=>x.id===id);

svg.addEventListener('pointermove', ev => {
  const wp = worldPos(ev);
  $('stCoord').textContent = `X: ${Math.round(wp.x)} Y: ${Math.round(wp.y)} mm`;
  if (ui.mode === 'select' && !ui.drag && !ui.drawing){
    svg.style.cursor = findWireRoute(ev) ? 'move' : '';
  }
  if (ui.drawing){
    ui.drawing.cursor = wp;
    renderOverlay();
    return;
  }
  const d = ui.drag;
  if (!d) return;
  if (d.type === 'pan'){
    ui.view.x = d.ox + (ev.clientX - d.sx);
    ui.view.y = d.oy + (ev.clientY - d.sy);
    if (Math.abs(ev.clientX-d.sx) + Math.abs(ev.clientY-d.sy) > 4) d.moved = true;
    applyView();
    return;
  }
  if (d.type === 'route'){
    if (!d.moved && Math.hypot(ev.clientX-d.sx, ev.clientY-d.sy) < 3) return;
    if (!d.moved){ snapshot(); d.moved = true; }
    const w = S.wires.find(x=>x.id===d.id); if (!w) return;
    routeDragMove(d, w, wp);
    return;
  }
  if (d.type === 'move'){
    if (!d.moved && Math.hypot(ev.clientX-d.sx, ev.clientY-d.sy) < 3) return;
    if (!d.moved){ snapshot(); d.moved = true; }
    const nx = snap(wp.x - d.dx), ny = snap(wp.y - d.dy);
    if (d.kind === 'element'){
      const e = S.elements.find(x=>x.id===d.id);
      const ox = e.x, oy = e.y;
      const c = CATALOG[e.type];
      let nx2 = clamp(nx, 0, S.w - c.w);
      let ny2 = e.y;
      /* vertical: only moves when near a din rail - element stays mounted on rail */
      let best=null, bd=Math.max(4, Math.min(20, c.h/4));
      for (const r of S.rails){
        if (nx2 + c.w <= r.x || nx2 >= r.x + r.len) continue;
        const dd = Math.abs((ny + c.h/2) - r.y);
        if (dd < bd){ bd=dd; best=r; }
      }
      if (best) ny2 = Math.round(best.y - c.h/2);
      ny2 = clamp(ny2, 0, S.h - c.h);
      /* enforce min spacing with other components / busbar zone */
      const cand = { x:nx2, y:ny2, w:c.w, h:c.h };
      if (!gapConflict(cand, e.id) || (nx2 === ox && ny2 === oy)){
        e.x = nx2; e.y = ny2;
        if (best) e.rail = best.id;
      }
      const ddx = e.x - ox, ddy = e.y - oy;
      if (ddx || ddy){
        for (const w of S.wires)
          if (w.from.el === e.id || w.to.el === e.id) rerouteWire(w);
      }
      renderElems(); renderTerms(); renderWires(); renderOverlay();
    } else if (d.kind === 'rail'){
      const r = S.rails.find(x=>x.id===d.id);
      const ox = r.x, oy = r.y;
      const nxx = clamp(nx, 0, S.w - r.len), nyy = clamp(ny, 10, S.h - 10);
      const dx = nxx - ox, dy = nyy - oy;
      if (dx || dy){
        if (!shiftRailChildren(r, dx, dy)){
          renderRails();
          return;
        }
        r.x = nxx; r.y = nyy;
      }
      renderRails(); renderProps();
    } else if (d.kind === 'duct'){
      const dd = S.ducts.find(x=>x.id===d.id);
      dd.x = clamp(nx, 0, S.w - dd.w); dd.y = clamp(ny, 0, S.h - dd.h);
      renderDucts();
    } else if (d.kind === 'bus'){
      const c = busCfg(d.id);
      const m = busMetrics(c);
      const ox = c.x, oy = c.y;
      const cbx = clamp(snap(wp.x - d.dx), 0, Math.max(0, S.w - m.w));
      const cby = clamp(snap(wp.y - d.dy), 0, Math.max(0, S.h - m.h));
      if (cbx === ox && cby === oy){ renderElems(); renderTerms(); renderBus(); renderWires(); renderOverlay(); }
      else {
        c.x = cbx; c.y = cby;
        const m2 = busMetrics(c);
        const cand = { x:m2.bx, y:m2.by, w:m2.w, h:m2.h };
        let blocked = false;
        for (const o of S.elements)
          if (rectsOverlap(cand, elemRect(o))){ blocked = true; break; }
        if (!blocked)
          for (const o of busList()){
            if (o.id === c.id) continue;
            const om = busMetrics(o);
            if (rectsOverlap(cand, { x:om.bx, y:om.by, w:om.w, h:om.h })){ blocked = true; break; }
          }
        if (blocked){ c.x = ox; c.y = oy; }
        else for (const w of S.wires)
          if (busOf(w.from.el, c) || busOf(w.to.el, c)) rerouteWire(w);
        renderElems(); renderTerms(); renderBus(); renderWires(); renderOverlay();
      }
    } else if (d.kind === 'label'){
      const l = S.labels.find(x=>x.id===d.id);
      l.x = nx; l.y = ny;
      renderLabels(); renderOverlay();
    }
    renderProps();
  }
});

function handleTermClick(elId, term){
  if (!ui.drawing){
    const p = getTermPos(elId, term);
    if (!p) return;
    ui.drawing = { from:{ el:elId, term:term }, pts:[p], cursor:p };
    renderOverlay();
    setStatus('Wire: klik terminal tujuan (Esc untuk batal)');
    return;
  }
  const d = ui.drawing;
  if (d.from.el === elId && d.from.term === term){ ui.drawing = null; renderOverlay(); return; }
  const target = getTermPos(elId, term);
  if (!target) return;
  const pts = orthoPreview(d.pts, target);
  pts[pts.length-1] = target;
  const w = { id:uid('w'), from:d.from, to:{ el:elId, term:term }, pts:pts,
    gauge:2.5, label:'', color:'', cls:'', twist:isTwistPair(d.from, { el:elId, term:term }) };
  w.rawPts = pts.slice();
  ui.drawing = null;
  const v = validateWire(w);
  if (v && v.level === 'error'){
    if (!confirm(v.msg + '\n\nTetap buat kabel ini?')){ renderOverlay(); return; }
  }
  snapshot();
  S.wires.push(w);
  networkColorFix(w.id);
  rebuildAllWires();
  markDirty();
  renderAll();
  if (v) setStatus('⚠ ' + v.msg); else setStatus('Kabel dibuat: ' + wireClsName(w));
}

  } else if (CATALOG[part]){
    const c = CATALOG[part];

    snapRail(e);

function makeGhost(part, wp){
  if (part === 'rail'){
    const x = snap(wp.x - STRUCT.rail.len/2), y = snap(wp.y);
    return { kind:'rail', x, y, ok: x>=0 && x+STRUCT.rail.len<=S.w && y>=10 && y<=S.h-10,
      msg:'Din rail di luar panel' };
  }
  if (part === 'duct'){
    const x = snap(wp.x - STRUCT.duct.w/2), y = snap(wp.y - STRUCT.duct.h/2);
    return { kind:'duct', x, y, ok: x>=0 && y>=0 && x+STRUCT.duct.w<=S.w && y+STRUCT.duct.h<=S.h,
      msg:'Ducting di luar panel' };
  }
  if (part === 'busbar'){
    const tmp = normBus(null, S.h, 'B'), d = busDims(tmp);
    const x = snap(wp.x - d.w/2), y = snap(wp.y - d.h/2);
    const rect = { x, y, w:d.w, h:d.h };
    let ok = inPanel(rect), msg = ok ? '' : 'Busbar di luar panel';
    if (ok) for (const o of S.elements)
      if (rectsOverlap(rect, elemRect(o))){ ok = false; msg = 'Busbar menabrak komponen'; break; }
    if (ok) for (const c of busList()){
      const m = busMetrics(c);
      if (rectsOverlap(rect, { x:m.bx, y:m.by, w:m.w, h:m.h })){ ok = false; msg = 'Menabrak busbar lain'; break; }
    }
    return { kind:'busbar', x, y, ok, msg };
  }
  const c = CATALOG[part];
  if (!c) return null;
  let x = snap(wp.x - c.w/2), y = snap(wp.y - c.h/2);
  x = clamp(x, 0, S.w - c.w); y = clamp(y, 0, S.h - c.h);
  const rect = { x, y, w:c.w, h:c.h };
  let ok = inPanel(rect), msg = ok ? '' : 'Di luar panel';
  let railY;
  /* rail snap preview */
  let best = null, bd = Math.max(4, Math.min(20, c.h/4));
  for (const r of S.rails){
    if (x + c.w <= r.x || x >= r.x + r.len) continue;
    const dd = Math.abs((y + c.h/2) - r.y);
    if (dd < bd){ bd = dd; best = r; }
  }
  if (best){ y = Math.round(best.y - c.h/2); rect.y = y; railY = best.y; }
  else { ok = false; msg = 'Elemen harus berada di atas din rail'; }
  const conflicts = gapConflict(rect);
  if (conflicts){
    ok = false;
    msg = conflicts.zone
      ? 'Overlap dengan area busbar'
      : 'Overlap dengan ' + (conflicts.name || CATALOG[conflicts.type].label);
  }
  return { kind:'elem', type:part, x, y, ok, msg, railY };
}

function getTermLabel(ref){

function bindPropInputs(obj, kind){
  $('rpBody').querySelectorAll('input[data-f],select[data-f]').forEach(inp => {
    inp.addEventListener('change', () => {
      snapshot();
      const f = inp.getAttribute('data-f');
      const prev = obj[f];
      let v = inp.type === 'checkbox' ? inp.checked : inp.value;
      if (f === 'color' && inp.type === 'text'){
        const m = String(v).trim().match(/^#?([0-9a-fA-F]{6})$/);
        if (!m) return;
        v = '#' + m[1].toLowerCase();
      }
      if (['x','y','w','h','len','gauge','rot','gap','tapGap'].includes(f)) v = parseFloat(v) || 0;
      if (f === 'rail') v = v || null;
      obj[f] = v;
      if (kind === 'rail' && (f === 'x' || f === 'y')){
        const dx = f === 'x' ? (parseFloat(obj.x) - parseFloat(prev)) : 0;
        const dy = f === 'y' ? (parseFloat(obj.y) - parseFloat(prev)) : 0;
        if (dx || dy) shiftRailChildren(obj, dx, dy);
      }
      if (kind === 'wire' && f === 'color'){
        for (const cw of wireNetwork(obj.id)) cw.color = v;
      }
      if (kind === 'element'){
        const c = CATALOG[obj.type];
        obj.x = clamp(obj.x, 0, S.w - c.w); obj.y = clamp(obj.y, 0, S.h - c.h);
        for (const w of S.wires)
          if (w.from.el === obj.id || w.to.el === obj.id) rerouteWire(w);
      }
      if (kind === 'bus'){
        obj.rot = ((obj.rot % 360) + 360) % 360;
        obj.len = Math.max(20, obj.len);
        obj.gap = Math.max(6, obj.gap);
        obj.tapGap = Math.max(10, obj.tapGap);
        const m = busMetrics(obj);
        obj.x = clamp(obj.x, 0, Math.max(0, S.w - m.w));
        obj.y = clamp(obj.y, 0, Math.max(0, S.h - m.h));
        for (const w of S.wires)
          if (busOf(w.from.el, obj) || busOf(w.to.el, obj)) rerouteWire(w);
      }
      markDirty(); renderAll();
    });
  });
}

  const gmap = new Map();
  for (const w of S.wires){
    const name = wireName(w), color = String(wireColor(w)).toLowerCase();
    const key = name + '\u0001' + color;
    let g = gmap.get(key);
    if (!g){ g = { key, name, color, wires:[] }; gmap.set(key, g); }
    g.wires.push(w);
  }
  const groups = Array.from(gmap.values());
  for (const g of groups) g.hidden = g.wires.every(w => ui.hiddenWires.has(w.id));
  const selId = ui.sel && ui.sel.kind === 'wire' ? ui.sel.id : '';
  let selKey = '';
  if (selId){ const sw = S.wires.find(x => x.id === selId); if (sw) selKey = wireName(sw) + '\u0001' + String(wireColor(sw)).toLowerCase(); }
  const fname = (ui.wpFilterName || '').toLowerCase();
  const fcol = ui.wpFilterColorActive ? String(ui.wpFilterColor || '').toLowerCase() : '';
  const sig = groups.map(g => g.key + ':' + (g.hidden ? '0' : '1')).join('|') +
    '#' + fname + '#' + fcol + '#' + selKey;
  if (!force && sig === _wpSig) return;
  _wpSig = sig;
  const list = $('wpList'); clearEl(list);
  const shown = groups.filter(g => {
    if (fname && g.name.toLowerCase().indexOf(fname) < 0) return false;
    if (fcol && g.color !== fcol) return false;
    return true;
  });
  $('wpCount').textContent = '(' + shown.length + '/' + groups.length + ')';
  $('wpCf').classList.toggle('on', !!fcol);
  if (!shown.length){
    const e = document.createElement('div');
    e.className = 'wp-empty';
    e.textContent = groups.length ? 'Tidak ada sinyal yang cocok filter.' : 'Belum ada wire di kanvas.';
    list.appendChild(e);
    return;
  }
  for (const g of shown){
    const row = document.createElement('div');
    row.className = 'wp-row' + (g.hidden ? ' off' : '') + (g.key === selKey ? ' sel' : '');
    const cb = document.createElement('input');
    cb.type = 'checkbox'; cb.checked = !g.hidden;
    cb.addEventListener('click', ev => ev.stopPropagation());
    cb.addEventListener('change', () => {
      for (const w of g.wires){ if (cb.checked) ui.hiddenWires.delete(w.id); else ui.hiddenWires.add(w.id); }
      renderWires(); renderWirePanel(true);
    });
    const nm = document.createElement('span');
    nm.className = 'wp-name'; nm.textContent = g.name;
    nm.title = g.name + '  (' + g.wires.length + ' wire)';
    const bar = document.createElement('span');
    bar.className = 'wp-bar'; bar.style.background = g.color; bar.title = g.color;
    row.appendChild(cb); row.appendChild(nm); row.appendChild(bar);
    row.addEventListener('click', () => { if (g.wires[0]) select('wire', g.wires[0].id); });
    list.appendChild(row);
  }
}

document.addEventListener('keydown', ev => {
  if (ev.target.tagName === 'INPUT' || ev.target.tagName === 'SELECT' || ev.target.tagName === 'TEXTAREA') return;
  if (ev.code === 'Space'){ ui.spaceDown = true; svg.style.cursor = 'grab'; ev.preventDefault(); }
  if (ev.key === 'Escape'){ ui.drawing = null; renderOverlay(); }
  if (ev.key === 'Delete' || ev.key === 'Backspace'){ deleteSelected(); ev.preventDefault(); }
  if ((ev.ctrlKey || ev.metaKey) && ev.key.toLowerCase() === 'z' && !ev.shiftKey){ undo(); ev.preventDefault(); }
  if ((ev.ctrlKey || ev.metaKey) && (ev.key.toLowerCase() === 'y' || (ev.key.toLowerCase()==='z' && ev.shiftKey))){ redo(); ev.preventDefault(); }
  if (ev.key.toLowerCase() === 'v') setMode('select');
  if (ev.key.toLowerCase() === 'w') setMode('wire');
  if (ev.key.toLowerCase() === 'l') setMode('label');
});

function openPanelSettings(pending){

  const m = $('modal');

    `<div class="mrow"><label>Depth (mm)</label><input id="ms_d" type="number" value="${pending.d}"></div>` +
    `<div class="rp-sec">Din Rails <button class="tb-btn" id="ms_addRail" style="float:right;padding:2px 8px">+ Add</button></div>` +
    `<table class="mtable"><tr><th>X</th><th>Y</th><th>Length</th><th></th></tr>` +

    `</table>` +
    `<div class="rp-sec">Ducting Segments <button class="tb-btn" id="ms_addDuct" style="float:right;padding:2px 8px">+ Add</button></div>` +
    `<table class="mtable"><tr><th>X</th><th>Y</th><th>W</th><th>H</th><th></th></tr>` +
      pending.ducts.map((d,i)=>`<tr><td><input data-t="duct" data-i="${i}" data-f="x" value="${d.x}"></td><td><input data-t="duct" data-i="${i}" data-f="y" value="${d.y}"></td><td><input data-t="duct" data-i="${i}" data-f="w" value="${d.w}"></td><td><input data-t="duct" data-i="${i}" data-f="h" value="${d.h}"></td><td><button class="del" data-del="duct" data-i="${i}">✕</button></td></tr>`).join('') +
    `</table>` +
    `<div class="empty" style="text-align:left">Busbar (L1/L2/L3/PE) fixed di sisi kiri panel, tidak dapat dipindah.</div>` +
    `</div><div class="mfoot"><button class="rp-btn" id="ms_cancel" style="width:auto;margin:0">Cancel</button><button class="rp-btn" id="ms_apply" style="width:auto;margin:0;background:#2563eb;border-color:#3b82f6;color:#fff">Apply</button></div>`;
  $('modalBg').classList.add('open');
  const sync = () => {
    document.querySelectorAll('#modal input[data-t]').forEach(inp => {
      const t = inp.getAttribute('data-t'), i = +inp.getAttribute('data-i'), f = inp.getAttribute('data-f');
      const obj = t==='rail' ? pending.rails[i] : pending.ducts[i];
      if (obj) obj[f] = parseFloat(inp.value) || 0;
    });
    pending.name = $('ms_name').value;
    pending.w = parseFloat($('ms_w').value) || pending.w;
    pending.h = parseFloat($('ms_h').value) || pending.h;
    pending.d = parseFloat($('ms_d').value) || pending.d;
  };
  $('ms_addRail').addEventListener('click', () => { sync(); pending.rails.push({ id:uid('r'), x:150, y:200, len:STRUCT.rail.len }); openPanelSettings(pending); });
  $('ms_addDuct').addEventListener('click', () => { sync(); pending.ducts.push({ id:uid('d'), x:150, y:200, w:STRUCT.duct.w, h:STRUCT.duct.h }); openPanelSettings(pending); });
  m.querySelectorAll('.del').forEach(btn => btn.addEventListener('click', () => {
    sync();
    const t = btn.getAttribute('data-del'), i = +btn.getAttribute('data-i');
    if (t==='rail') pending.rails.splice(i,1); else pending.ducts.splice(i,1);
    openPanelSettings(pending);
  }));
  $('ms_cancel').addEventListener('click', () => $('modalBg').classList.remove('open'));
  $('ms_apply').addEventListener('click', () => {
    sync();
    snapshot();
    S.name = pending.name || S.name;
    S.w = pending.w; S.h = pending.h; S.d = pending.d;
    S.rails = pending.rails; S.ducts = pending.ducts;
    for (const e of S.elements){
      const c = CATALOG[e.type];
      e.x = clamp(e.x, 0, S.w - c.w); e.y = clamp(e.y, 0, S.h - c.h);
      e.rail = S.rails.some(r=>r.id===e.rail) ? e.rail : null;
    }
    S.wires = S.wires.filter(w => (w.from.el && findBus(w.from.el)) || (w.to.el && findBus(w.to.el)) ||
      (getTermPos(w.from.el, w.from.term) && getTermPos(w.to.el, w.to.term)));
    $('modalBg').classList.remove('open');
    markDirty(); fitView(); renderAll();
  });
}

function contentBBox(){
  /* bbox koordinat-dunia dari seluruh konten (tanpa grid & overlay) */
  const ids = ['lyrPanel','lyrBus','lyrRail','lyrDuct','lyrElem','lyrWire','lyrTerm','lyrLabel'];
  let x0=Infinity, y0=Infinity, x1=-Infinity, y1=-Infinity, found=false;
  for (const id of ids){
    const g = document.getElementById(id); if (!g) continue;
    let bb; try { bb = g.getBBox(); } catch(e){ continue; }
    if (!bb || (!bb.width && !bb.height)) continue;
    x0=Math.min(x0, bb.x); y0=Math.min(y0, bb.y);
    x1=Math.max(x1, bb.x+bb.width); y1=Math.max(y1, bb.y+bb.height);
    found = true;
  }
  if (!found) return { x:0, y:0, w:S.w, h:S.h };
  return { x:x0, y:y0, w:x1-x0, h:y1-y0 };
}
function printPanel(){
  /* viewBox mencakup panel + semua kabel yang dirutekan di luar box */
  const bb = contentBBox();
  const m = 24;        /* margin sekeliling konten (mm) */
  const titleH = 18;   /* ruang judul di atas */
  const minX = Math.min(0, bb.x) - m;
  const minY = Math.min(0, bb.y) - m - titleH;
  const maxX = Math.max(S.w, bb.x + bb.w) + m;
  const maxY = Math.max(S.h, bb.y + bb.h) + m;
  const vbW = maxX - minX, vbH = maxY - minY;

  const clone = svg.cloneNode(true);
  clone.removeAttribute('id');
  clone.setAttribute('width', Math.round(vbW));
  clone.setAttribute('height', Math.round(vbH));
  clone.setAttribute('viewBox', `${minX} ${minY} ${vbW} ${vbH}`);
  clone.setAttribute('preserveAspectRatio', 'xMidYMid meet');
  clone.setAttribute('xmlns', 'http://www.w3.org/2000/svg');
  /* bersihkan elemen interaktif & grid */
  clone.querySelectorAll('.term-hit,.wire-hit,.ghost,.sel-outline').forEach(n => n.remove());
  const gGrid = clone.querySelector('#lyrGrid'); if (gGrid) gGrid.style.display = 'none';
  const gOver = clone.querySelector('#lyrOver'); if (gOver) gOver.style.display = 'none';
  /* background box panel -> putih */
  const gPanel = clone.querySelector('#lyrPanel');
  if (gPanel){ const pr = gPanel.querySelector('rect'); if (pr) pr.setAttribute('fill', '#ffffff'); }
  /* viewBox memakai koordinat dunia, jadi transform viewport direset */
  const gView = clone.querySelector('#viewport');
  if (gView) gView.removeAttribute('transform');
  /* latar putih + judul + ukuran */
  const mk = (tag, attrs) => { const e = document.createElementNS('http://www.w3.org/2000/svg', tag); for (const k in attrs) e.setAttribute(k, attrs[k]); return e; };
  clone.insertBefore(mk('rect', { x:minX, y:minY, width:vbW, height:vbH, fill:'#ffffff' }), clone.firstChild);
  const title = mk('text', { x:minX+m, y:minY+m+4, 'font-size':13, 'font-weight':600, fill:'#111' });
  title.textContent = S.name || 'Panel Designer';
  const sub = mk('text', { x:maxX-m, y:minY+m+4, 'font-size':9, 'text-anchor':'end', fill:'#64748b' });
  sub.textContent = `${S.w} x ${S.h} mm`;
  clone.appendChild(title); clone.appendChild(sub);

  /* orientasi halaman mengikuti rasio bbox cetak */
  let ps = document.getElementById('printPageStyle');
  if (!ps){ ps = document.createElement('style'); ps.id = 'printPageStyle'; document.head.appendChild(ps); }
  ps.textContent = `@page{ size:${vbW > vbH ? 'landscape' : 'portrait'}; margin:8mm }`;

  /* Overlay */
  let ov = $('printOverlay');
  if (!ov){
    ov = document.createElement('div');
    ov.id = 'printOverlay';
    document.body.appendChild(ov);
  }
  ov.innerHTML = '';
  ov.appendChild(clone);

  /* Hide UI, tampilkan overlay, trigger print */
  document.documentElement.classList.add('printing');
  setTimeout(() => {
    window.print();
  }, 50);

  const afterPrint = () => {
    document.documentElement.classList.remove('printing');
    ov.innerHTML = '';
    window.removeEventListener('afterprint', afterPrint);
  };
  window.addEventListener('afterprint', afterPrint);
}

function applyBasDesign(d, label){
  d.labels = d.labels || []; d.wires = d.wires || []; d.elements = d.elements || [];
  d.rails = d.rails || []; d.ducts = d.ducts || [];
  normBuses(d);
  snapshot();
  S = d;
  ui.sel = null; ui.drawing = null;
  rebuildAllWires();
  markDirty();
  saveLS();
  fitView(); renderAll();
  $('modalBg').classList.remove('open');
  setStatus('Membuka contoh ' + (label || 'Panel BAS'));
}
function loadExample(file, embed, label){
  fetch(file)
    .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
    .then(d => { if (!d || typeof d.w !== 'number') throw new Error('invalid'); applyBasDesign(d, label); })
    .catch(() => applyBasDesign(JSON.parse(JSON.stringify(embed)), label));
}

             <span>Contoh panel BAS sederhana: MCB, meter 1P & 3P, kontaktor NCH8, PLC FX3U, PSU 24V dan gateway MODBUS - sudah tersambung wiring.</span>
           </div>
         </div>
         <div class="welcome-card" data-opt="completed">
           <div class="wthumb"><img src="docs/thumbnail_example_panel_bas_completed.png" alt="Complete BAS"></div>
           <div class="wtext">
             <b>Complete BAS</b>
             <span>Panel BAS lengkap 520&times;720 mm: 56 komponen, 243 kabel, 2 busbar - contoh desain penuh building automation.</span>
           </div>
         </div>
         <div class="welcome-card" data-opt="empty">
           <div class="wthumb"><img src="docs/thumbnail_example_panel_empty.png" alt="Empty Panel"></div>
           <div class="wtext">
             <b>Empty Panel</b>
             <span>Mulai dari nol: hanya ducting, din rail dan busbar - tanpa kabel maupun komponen.</span>
           </div>
         </div>
       </div>
     </div>
     <div class="mfoot"><button class="rp-btn" id="ms_cancel" style="width:auto;margin:0">Batal</button></div>`;
  $('modalBg').classList.add('open');
  m.querySelectorAll('.welcome-card').forEach(card => card.addEventListener('click', () => {
    const opt = card.getAttribute('data-opt');
    if (opt === 'bas'){ loadBasFromJson(); return; }
    if (opt === 'completed'){ loadBasCompletedFromJson(); return; }
    if (opt === 'empty'){ loadEmptyExample(); return; }
  }));
  $('ms_cancel').addEventListener('click', () => {
    $('modalBg').classList.remove('open');
  });
}
function init(){
  const fresh = !loadLS();
  if (fresh) S = JSON.parse(JSON.stringify(EXAMPLE_EMPTY));
  buildLibrary();
  applyView();
  fitView();
  renderAll();
  updateStatus();
  $('stSave').textContent = 'Auto-save: setiap 5 detik';
  if (fresh) showWelcome();
  window.addEventListener('resize', () => { /* keep view */ });
}
init();
</script>
